services:
  db:
    restart: "no"
    ports:
      - "5432:5432"

  docling:
    restart: "no"

  backend:
    restart: "no"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --reload
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
